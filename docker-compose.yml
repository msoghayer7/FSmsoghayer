version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fsm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fsm_user
      POSTGRES_PASSWORD: fsm_password
      POSTGRES_DB: fsm_erp
    ports:
      - "5432:5432"
    volumes:
      - fsm_postgres_data:/var/lib/postgresql/data

volumes:
  fsm_postgres_data:
